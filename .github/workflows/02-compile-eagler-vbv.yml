name: "02 - Build Eaglercraft 26.2 u2 (VBV + Herz)"

run-name: "02 - Build VBV + Herz from known-good U2 workspace"

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  U2_REPO: "https://github.com/CynTheSolveroftheabsolutefabric/Eaglercraft-26.2-u2-workspace.git"
  U2_COMMIT: "f0dafd1e3c1fb39006735ffc0bc6fd879fa98de3"

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout this mod project
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Checkout known-good Eaglercraft 26.2 u2 workspace
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-tags --filter=blob:none "$U2_REPO" eaglercraft-u2
          cd eaglercraft-u2
          git fetch --no-tags --depth 1 origin "$U2_COMMIT"
          git checkout --detach "$U2_COMMIT"
          test -x gradlew
          test -d game/src/main/java
          test -f wasm-toolchain/build-single-html.js
          test -f package.json
          echo "Using U2 workspace commit: $(git rev-parse HEAD)"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: eaglercraft-u2/package.json

      - name: Make Gradle executable
        run: chmod +x eaglercraft-u2/gradlew

      - name: Inject VBV + Herz and embedded resource-pack mods
        shell: bash
        run: |
          set -euo pipefail
          python3 VBV/patch/apply_vbv_patch.py "$PWD/eaglercraft-u2"

          vbv_src="eaglercraft-u2/game/src/main/java/com/melonman106/vbvclient"
          for source in VBVClient.java HerzVBVBridge.java HerzClient.java HerzMod.java HerzModRegistry.java VBVGeneratedPackMods.java; do
            test -f "$vbv_src/$source" || {
              echo "::error::Required VBV/Herz source was not injected: $vbv_src/$source"
              exit 1
            }
          done

          grep -q 'HerzVBVBridge.initialize' "$vbv_src/VBVClient.java"
          grep -q 'HerzVBVBridge.register' "$vbv_src/VBVClient.java"

          test -d eaglercraft-u2/game/src/main/resources/vbvclient/mods
          find eaglercraft-u2/game/src/main/resources/vbvclient/mods -maxdepth 2 -type f -print | sort

      - name: Compile game Java after injection
        working-directory: eaglercraft-u2
        run: ./gradlew :game:compileJava --console=plain --no-daemon --stacktrace

      - name: Install U2 browser packaging dependency
        working-directory: eaglercraft-u2
        run: npm ci --ignore-scripts

      - name: Restore bundled U2 sounds archive before standalone build
        shell: bash
        run: |
          set -euo pipefail
          web="eaglercraft-u2/target_teavm_wasm_gc/build/web"
          mkdir -p "$web"

          sounds_url="https://raw.githubusercontent.com/melonman106/Eagler-26.2-Client/generated-u2-source/sounds.epk"
          curl -fL --retry 5 --retry-delay 2 "$sounds_url" -o "$web/sounds.epk"

          test -s "$web/sounds.epk" || {
            echo "::error::Failed to restore sounds.epk from generated-u2-source"
            exit 1
          }
          echo "Restored sounds.epk: $(stat -c%s "$web/sounds.epk") bytes"
          sha256sum "$web/sounds.epk"

      - name: Patch standalone packager for lean no-music build
        working-directory: eaglercraft-u2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("wasm-toolchain/build-single-html.js")
          text = path.read_text(encoding="utf-8")

          old_source = '''if (!fs.existsSync(musicSource)) {
            fail(`missing music EPK at ${musicSource}; build the regular TeaVM web assets first`);
          }
          const music = withMusic ? fs.readFileSync(musicSource) : null;'''
          new_source = '''if (withMusic && !fs.existsSync(musicSource)) {
            fail(`missing music EPK at ${musicSource}; build the regular TeaVM web assets first`);
          }
          const music = withMusic ? fs.readFileSync(musicSource) : null;'''

          if old_source in text:
              text = text.replace(old_source, new_source, 1)
              print("Patched music-source check.")
          elif 'if (withMusic && !fs.existsSync(musicSource))' in text:
              print("Music-source check already patched.")
          else:
              raise SystemExit("Expected music-source check was not found; refusing to patch an unknown U2 packager")

          old_export = '''if (withoutMusic && !liteBuild) {
            const musicPack = spawnSync(process.execPath, [
              path.join(repo, "wasm-toolchain", "export-music-resource-pack.js"),
              musicSource,
              musicPackOutput
            ], { cwd: repo, stdio: "inherit" });
            if (musicPack.error) fail(musicPack.error.message);
            if (musicPack.status !== 0) fail(`optional music pack export exited with code ${musicPack.status}`);
          } else if (liteBuild) {
            console.log("[single-html] Lite mode: optional music pack export skipped");
          }'''
          new_export = '''if (withoutMusic && !liteBuild && fs.existsSync(musicSource)) {
            const musicPack = spawnSync(process.execPath, [
              path.join(repo, "wasm-toolchain", "export-music-resource-pack.js"),
              musicSource,
              musicPackOutput
            ], { cwd: repo, stdio: "inherit" });
            if (musicPack.error) fail(musicPack.error.message);
            if (musicPack.status !== 0) fail(`optional music pack export exited with code ${musicPack.status}`);
          } else if (withoutMusic && !liteBuild) {
            console.log("[single-html] No music.epk present; optional music pack export skipped");
          } else if (liteBuild) {
            console.log("[single-html] Lite mode: optional music pack export skipped");
          }'''

          if old_export in text:
              text = text.replace(old_export, new_export, 1)
              print("Patched optional music export to skip when music.epk is absent.")
          elif 'fs.existsSync(musicSource)' in text and 'optional music pack export skipped' in text:
              print("Optional music export already patched.")
          else:
              raise SystemExit("Expected optional music export block was not found; refusing to patch an unknown U2 packager")

          path.write_text(text, encoding="utf-8")
          PY

          grep -q 'if (withMusic && !fs.existsSync(musicSource))' wasm-toolchain/build-single-html.js
          grep -q 'withoutMusic && !liteBuild && fs.existsSync(musicSource)' wasm-toolchain/build-single-html.js
          grep -q 'No music.epk present; optional music pack export skipped' wasm-toolchain/build-single-html.js

      - name: Build standalone Eaglercraft 26.2 u2 HTML
        working-directory: eaglercraft-u2
        env:
          EAGLER_LINK_CAP_MIB: "13312"
          EAGLER_LINK_HEAP_MIB: "11264"
          EAGLER_SERVER_LINK_CAP_MIB: "13312"
          EAGLER_SERVER_LINK_HEAP_MIB: "11264"
          EAGLER_BUILD_CAP_MIB: "13312"
        run: |
          set -euo pipefail
          npm run build:single -- --output "$GITHUB_WORKSPACE/eaglercraft-26.2-vbv-herz.html"

          test -s "$GITHUB_WORKSPACE/eaglercraft-26.2-vbv-herz.html"
          grep -q 'eag-inline-wasm-br' "$GITHUB_WORKSPACE/eaglercraft-26.2-vbv-herz.html"
          grep -q 'eag-inline-mesh-wasm-br' "$GITHUB_WORKSPACE/eaglercraft-26.2-vbv-herz.html"
          grep -q 'eag-inline-server-wasm-br' "$GITHUB_WORKSPACE/eaglercraft-26.2-vbv-herz.html"
          grep -q 'eag-inline-assets' "$GITHUB_WORKSPACE/eaglercraft-26.2-vbv-herz.html"
          grep -q 'eag-inline-sounds' "$GITHUB_WORKSPACE/eaglercraft-26.2-vbv-herz.html"
          if grep -q 'eag-inline-music' "$GITHUB_WORKSPACE/eaglercraft-26.2-vbv-herz.html"; then
            echo "::error::Lean build unexpectedly embedded music.epk"
            exit 1
          fi
          echo "Built HTML: $(stat -c%s "$GITHUB_WORKSPACE/eaglercraft-26.2-vbv-herz.html") bytes"

      - name: Upload standalone HTML client
        uses: actions/upload-artifact@v4
        with:
          name: Eaglercraft-26.2-VBV-Herz-Single-HTML-${{ github.run_id }}
          path: eaglercraft-26.2-vbv-herz.html
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload raw browser website too
        uses: actions/upload-artifact@v4
        with:
          name: Eaglercraft-26.2-VBV-Herz-Web-${{ github.run_id }}
          path: eaglercraft-u2/target_teavm_wasm_gc/build/web/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
