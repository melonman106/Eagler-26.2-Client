name: "02 - Build Eaglercraft 26.2 u2 (VBV + Herz)"

run-name: "02 - Build VBV + Herz"

on:
  workflow_dispatch:
  
permissions:
  contents: read

env:
  U2_REPO: "https://github.com/kingjoeishere/Eaglercraft-26.2-u2-workspace.git"
  U2_COMMIT: "f0dafd1e3c1fb39006735ffc0bc6fd879fa98de3"

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout this mod project
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Checkout known-good Eaglercraft 26.2 u2 workspace
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-tags --filter=blob:none "$U2_REPO" eaglercraft-u2
          cd eaglercraft-u2
          git fetch --no-tags --depth 1 origin "$U2_COMMIT"
          git checkout --detach "$U2_COMMIT"
          test -x gradlew
          test -d game/src/main/java
          test -f wasm-toolchain/build-single-html.js
          test -f package.json
          echo "Using U2 workspace commit: $(git rev-parse HEAD)"
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: eaglercraft-u2/package.json

      - name: Make Gradle executable
        run: chmod +x eaglercraft-u2/gradlew

      - name: Restore verified resource overlay from the U2 Setup kit
        shell: bash
        run: |
          set -euo pipefail
          setup_jar="$RUNNER_TEMP/Eaglercraft-26.2-u2-Setup.jar"
          portable_kit="$RUNNER_TEMP/portable-kit.zip"
          portable_root="$RUNNER_TEMP/portable-kit"
          overlay_target="legacy-u1-kit/inputs/resource-overlay-normal.zip"
          expected_setup_sha256="d8e7240fba804249eae5706a6641b3fbd783a4c09923d31d4ee4c6386a273587"
          expected_overlay_sha256="2ba7e3376891c64f8bf57f3687e05b8dbe1971a75475b6825449e5e5f96d71f3"
          setup_url="https://github.com/melonman106/Eagler-26.2-Client/releases/download/Cleit/Eaglercraft-26.2-u2-Setup.jar"
          curl --fail --location --retry 3 "$setup_url" -o "$setup_jar"
          echo "$expected_setup_sha256  $setup_jar" | sha256sum --check
          unzip -p "$setup_jar" portable-kit.zip > "$portable_kit"
          test -s "$portable_kit"
          mkdir -p "$portable_root"
          unzip -q -o "$portable_kit" -d "$portable_root"
          overlay="$(find "$portable_root" -type f -name 'resource-overlay-normal.zip' -print -quit)"
          test -n "$overlay" || { echo "::error::The verified portable kit does not contain resource-overlay-normal.zip"; exit 1; }
          echo "$expected_overlay_sha256  $overlay" | sha256sum --check
          mkdir -p "$(dirname "$overlay_target")"
          cp "$overlay" "$overlay_target"
          echo "Restored verified resource overlay: $overlay_target"
      - name: Install FFmpeg for image asset normalization
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          command -v ffmpeg
          ffmpeg -version | head -n 1
      - name: Inject VBV + Herz and embedded resource-pack mods
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'status=$?; echo "::error::Injection step failed at line ${LINENO}: ${BASH_COMMAND} (exit ${status})"; exit "$status"' ERR
          python3 -m pip install --disable-pip-version-check Pillow
          python3 VBV/patch/apply_vbv_patch.py "$PWD/eaglercraft-u2"
          vbv_src="eaglercraft-u2/game/src/main/java/com/melonman106/vbvclient"
          pack_registry="$vbv_src/VBVGeneratedPackMods.java"
          test -s "$pack_registry" || { echo "::error::Generated resource-pack registry is missing"; exit 1; }
          expected_pack_count="$(find "$GITHUB_WORKSPACE/ModsPack" -type f -name '*.zip' ! -path '*/__MACOSX/*' | wc -l)"
          actual_pack_count="$(grep -Fc 'VBVClient.registerMod' "$pack_registry" || true)"
          if [ "$actual_pack_count" -ne "$expected_pack_count" ]; then
            echo "::error::Only $actual_pack_count of $expected_pack_count resource packs were imported"
            exit 1
          fi
          grep -qi 'qrafty' "$pack_registry" || { echo "::error::Qrafty font pack was not registered"; exit 1; }
          echo "Verified $actual_pack_count embedded resource packs, including the custom font pack."
          for source in VBVClient.java VBVAppleSkin.java VBVExtraFeatures.java VBVFirstPersonAnimations.java VBVFirstPersonAnimationsConfigScreen.java VBVStorage.java VBVStorageScreen.java HerzVBVBridge.java HerzClient.java HerzMod.java HerzModRegistry.java VBVGeneratedPackMods.java VBVLauncherScreen.java VBVModrinth.java VBVPackInstaller.java VBVTheme.java VBVUi.java; do
            test -f "$vbv_src/$source" || { echo "::error::Required VBV/Herz source was not injected: $vbv_src/$source"; exit 1; }
          done
          test -s VBV/patch/storage_manager.js || { echo "::error::Filesystem storage manager source is missing"; exit 1; }
          echo "Litematica and MaLiLib are intentionally excluded from this build."
          grep -q 'VBV_STORAGE_MANAGER_V1' VBV/patch/storage_manager.js
          ! grep -q 'HerzVBVBridge.initialize' "$vbv_src/VBVClient.java"
          grep -q 'HerzVBVBridge.register' "$vbv_src/VBVClient.java"
          grep -q 'HerzVBVBridge.initialize' "$vbv_src/fabriccompat/FabricCompatClient.java"
          compat_src="eaglercraft-u2/game/src/main/java/com/melonman106/vbvclient/fabriccompat"
          for source in FabricCompatClient.java FabricLoader.java ModMetadata.java ModContainer.java ModInitializer.java ClientTickEvents.java ClientLifecycleEvents.java KeyBinding.java KeyBindingHelper.java EnvType.java; do
            test -s "$compat_src/$source" || { echo "::error::Required Fabric compatibility source is missing: $compat_src/$source"; exit 1; }
          done
          grep -q 'FabricCompatClient.initialize' "$vbv_src/HerzClient.java"
          grep -q 'FabricCompatClient.tick' "$vbv_src/HerzClient.java"
          test -s eaglercraft-u2/game/src/main/java/net/fabricmc/api/ModInitializer.java
          test -s eaglercraft-u2/game/src/main/java/net/fabricmc/api/EnvType.java
          test -s eaglercraft-u2/game/src/main/java/net/fabricmc/loader/api/FabricLoader.java
          test -s eaglercraft-u2/game/src/main/java/net/fabricmc/loader/api/ModContainer.java
          test -s eaglercraft-u2/game/src/main/java/net/fabricmc/loader/api/metadata/ModMetadata.java
          test -s eaglercraft-u2/game/src/main/java/net/fabricmc/fabric/api/client/event/lifecycle/v1/ClientTickEvents.java
          test -s eaglercraft-u2/game/src/main/java/net/fabricmc/fabric/api/client/event/lifecycle/v1/ClientLifecycleEvents.java
          test -s eaglercraft-u2/game/src/main/java/net/fabricmc/fabric/api/client/event/lifecycle/v1/ClientResourceEvents.java
          test -s eaglercraft-u2/game/src/main/java/net/fabricmc/fabric/api/client/screen/v1/ScreenEvents.java
          test -s eaglercraft-u2/game/src/main/java/net/fabricmc/fabric/api/client/rendering/v1/HudRenderCallback.java
          test -s eaglercraft-u2/game/src/main/java/net/fabricmc/fabric/api/client/keybinding/v1/KeyBindingHelper.java
          grep -R -q 'FabricCompatClient.startTick(this);' eaglercraft-u2/game/src/main/java
          grep -R -q 'FabricCompatClient.endTick(this);' eaglercraft-u2/game/src/main/java/net/minecraft/client
          grep -R -q 'KeyBindingHelper.onKeyPressed(event.key())' eaglercraft-u2/game/src/main/java
          test -s eaglercraft-u2/game/src/main/java/net/fabricmc/fabric/api/client/screen/v1/ScreenEvents.java
          test -s eaglercraft-u2/game/src/main/java/net/fabricmc/fabric/api/client/rendering/v1/HudRenderCallback.java
          test -s eaglercraft-u2/game/src/main/java/net/fabricmc/fabric/api/client/event/lifecycle/v1/ClientResourceEvents.java
          grep -q 'ScreenEvents.fireBeforeInit' eaglercraft-u2/game/src/main/java/net/minecraft/client/gui/screens/Screen.java
          grep -q 'ScreenEvents.fireAfterRender' eaglercraft-u2/game/src/main/java/net/minecraft/client/gui/screens/Screen.java
          grep -q 'HudRenderCallback.fire' eaglercraft-u2/game/src/main/java/net/minecraft/client/gui/Hud.java
          grep -q 'HudRenderCallback.EVENT.register' eaglercraft-u2/game/src/main/java/com/melonman106/vbvclient/VBVClient.java
          grep -q 'ClientTickEvents.END_CLIENT_TICK.register' eaglercraft-u2/game/src/main/java/com/melonman106/vbvclient/VBVClient.java
          grep -q 'KeyBindingHelper.registerKeyBinding' eaglercraft-u2/game/src/main/java/com/melonman106/vbvclient/VBVExtraFeatures.java
          test -s eaglercraft-u2/game/src/main/resources/assets/vbvclient/lang/en_us.json
          ! grep -q 'VBVWorldMap.tick();' eaglercraft-u2/game/src/main/java/net/minecraft/client/Minecraft.java
          grep -q 'ClientResourceEvents.fireReload' eaglercraft-u2/game/src/main/java/net/minecraft/client/Minecraft.java
          grep -q 'VBV_DUNGEONS_GUI_TITLE_HOOK' eaglercraft-u2/game/src/main/java/net/minecraft/client/gui/Gui.java
          nav_src='eaglercraft-u2/game/src/main/java/com/melonman106/vbvclient/VBVNav.java'
          grep -q 'SafetyScreen' "$nav_src"
          grep -q 'JoinMultiplayerScreen' "$nav_src"
          grep -q 'SelectWorldScreen' "$nav_src"
          grep -q 'EaglerIntegratedServerStartupScreen' "$nav_src"
          grep -q 'OptionsScreen' "$nav_src"
          sleep_src='eaglercraft-u2/platform-teavm/src/main/java/net/lax1dude/eaglercraft/v1_8/internal/PlatformRuntime.java'
          grep -Fq 'Window.setTimeout(() -> callback.complete(null), millis);' "$sleep_src"
          ! grep -q 'VBVSleepTimer' "$sleep_src"
          ! grep -q 'vbvPendingSleepCallbacks' "$sleep_src"
          grep -q 'VBV_SERVER_WORKER_OPT_IN_ONLY' eaglercraft-u2/platform-teavm/src/main/java/net/lax1dude/eaglercraft/v1_8/sp/internal/ClientPlatformSingleplayer.java
          grep -q 'EaglerProfileScreen26' eaglercraft-u2/game/src/main/java/com/melonman106/vbvclient/VBVLauncherScreen.java
          grep -q 'VBVLauncherScreen' eaglercraft-u2/game/src/main/java/com/melonman106/vbvclient/VBVDungeonsTitleScreen.java
          grep -q 'VBV_MODRINTH_PACK_INSTALL' eaglercraft-u2/game/src/main/java/net/minecraft/client/gui/screens/packs/PackSelectionScreen.java
          grep -q 'VBV_SCREEN_RESIZE_GUARD' eaglercraft-u2/game/src/main/java/net/minecraft/client/gui/screens/Screen.java
          grep -q 'VBV_FIRST_PERSON_ITEM_OFFSET' eaglercraft-u2/game/src/main/java/net/minecraft/client/renderer/ItemInHandRenderer.java
          grep -q 'EaglerProfile.getActiveSkinResourceLocation' eaglercraft-u2/game/src/main/java/com/melonman106/vbvclient/VBVDungeonsTitleScreen.java
          grep -q '"shine"' eaglercraft-u2/game/src/main/java/com/melonman106/vbvclient/VBVModsScreen.java
          grep -q 'ShineConfig.save' eaglercraft-u2/game/src/main/java/com/melonman106/vbvclient/ShineConfig.java || grep -q 'private static void save()' eaglercraft-u2/game/src/main/java/com/melonman106/vbvclient/ShineConfig.java
          grep -R -q 'VBVExtraFeatures.handleKey' eaglercraft-u2/game/src/main/java
          grep -R -q 'VBVExtraFeatures.renderDebug' eaglercraft-u2/game/src/main/java
          grep -q 'VBVExtraFeatures.isBetterF3Enabled()' eaglercraft-u2/game/src/main/java/net/minecraft/client/gui/components/DebugScreenOverlay.java
          grep -q 'VBVFirstPersonAnimations.toggle()' eaglercraft-u2/game/src/main/java/com/melonman106/vbvclient/VBVFirstPersonAnimationsConfigScreen.java
          held_renderer='eaglercraft-u2/game/src/main/java/net/minecraft/client/renderer/ItemInHandRenderer.java'
          held_arm_helper='eaglercraft-u2/game/src/main/java/com/melonman106/vbvclient/VBVFirstPersonAnimations.java'
          grep -q 'VBV_FIRST_PERSON_HELD_ARM' "$held_renderer"
          grep -q 'this.renderPlayerArm(poseStack, submitNodeCollector, lightCoords, inverseArmHeight, attack, arm)' "$held_renderer"
          grep -q 'return enabled;' "$held_arm_helper"
          test -d eaglercraft-u2/game/src/main/resources/assets/vbvclient/mods
          icon_root="eaglercraft-u2/game/src/main/resources/assets/vbvclient/textures/mods"
          for icon in viabackportvisuals-client ukus-armor-hud simple-hud-enhanced mouse-tweaks appleskin gamma-utils zoomify betterf3 vbv-minimap jade shulkerboxtooltip; do
            test -s "$icon_root/$icon.png" || { echo "::error::Required VBV mod icon was not installed: $icon_root/$icon.png"; exit 1; }
          done
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          icon_root = Path("eaglercraft-u2/game/src/main/resources/assets/vbvclient/textures/mods")
          pack_root = Path("eaglercraft-u2/game/src/main/resources/assets/vbvclient/mods")
          files = {path for path in icon_root.glob("*.png") if path.name != "warn.png"} if icon_root.exists() else set()
          if pack_root.exists(): files.update(path for path in pack_root.rglob("*.png") if path.name == "pack.png")
          for path in sorted(files):
              with Image.open(path) as source: image = source.convert("RGBA")
              image = ImageOps.contain(image, (64, 64), method=Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA", (64, 64), (0, 0, 0, 0))
              canvas.alpha_composite(image, ((64 - image.width) // 2, (64 - image.height) // 2))
              canvas.save(path, format="PNG", optimize=True)
          PY
          test -s eaglercraft-u2/game/src/main/resources/assets/minecraft/textures/gui/title/background/panorama_0.png
          test -s eaglercraft-u2/game/src/main/resources/assets/minecraft/textures/gui/title/background/panorama_5.png
      - name: Compile game Java after injection
        working-directory: eaglercraft-u2
        run: ./gradlew :game:processResources :game:compileJava --console=plain --no-daemon --build-cache --stacktrace

      - name: Install U2 browser packaging dependency
        working-directory: eaglercraft-u2
        run: npm ci --ignore-scripts

      - name: Restore bundled U2 sounds archive before standalone build
        shell: bash
        run: |
          set -euo pipefail
          web="eaglercraft-u2/target_teavm_wasm_gc/build/web"
          mkdir -p "$web"
          # sounds.epk is committed at the repository root and already checked out
          # above. It used to be downloaded from the generated-u2-source branch,
          # which no longer exists (the download returned HTTP 404).
          test -s "$GITHUB_WORKSPACE/sounds.epk" || { echo "::error::sounds.epk is missing from the repository root"; exit 1; }
          cp "$GITHUB_WORKSPACE/sounds.epk" "$web/sounds.epk"
          test -s "$web/sounds.epk"
          sha256sum "$web/sounds.epk"
      - name: Patch standalone packager for lean no-music build
        working-directory: eaglercraft-u2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("wasm-toolchain/build-single-html.js")
          text = path.read_text(encoding="utf-8")
          old_source = '''if (!fs.existsSync(musicSource)) {
            fail(`missing music EPK at ${musicSource}; build the regular TeaVM web assets first`);
          }
          const music = withMusic ? fs.readFileSync(musicSource) : null;'''
          new_source = '''if (withMusic && !fs.existsSync(musicSource)) {
            fail(`missing music EPK at ${musicSource}; build the regular TeaVM web assets first`);
          }
          const music = withMusic ? fs.readFileSync(musicSource) : null;'''
          if old_source in text: text = text.replace(old_source, new_source, 1)
          elif 'if (withMusic && !fs.existsSync(musicSource))' not in text: raise SystemExit("Expected music-source check was not found")
          old_export = '''if (withoutMusic && !liteBuild) {
            const musicPack = spawnSync(process.execPath, [
              path.join(repo, "wasm-toolchain", "export-music-resource-pack.js"),
              musicSource,
              musicPackOutput
            ], { cwd: repo, stdio: "inherit" });
            if (musicPack.error) fail(musicPack.error.message);
            if (musicPack.status !== 0) fail(`optional music pack export exited with code ${musicPack.status}`);
          } else if (liteBuild) {
            console.log("[single-html] Lite mode: optional music pack export skipped");
          }'''
          new_export = '''if (withoutMusic && !liteBuild && fs.existsSync(musicSource)) {
            const musicPack = spawnSync(process.execPath, [
              path.join(repo, "wasm-toolchain", "export-music-resource-pack.js"),
              musicSource,
              musicPackOutput
            ], { cwd: repo, stdio: "inherit" });
            if (musicPack.error) fail(musicPack.error.message);
            if (musicPack.status !== 0) fail(`optional music pack export exited with code ${musicPack.status}`);
          } else if (withoutMusic && !liteBuild) {
            console.log("[single-html] No music.epk present; optional music pack export skipped");
          } else if (liteBuild) {
            console.log("[single-html] Lite mode: optional music pack export skipped");
          }'''
          if old_export in text: text = text.replace(old_export, new_export, 1)
          elif 'fs.existsSync(musicSource)' not in text: raise SystemExit("Expected optional music export block was not found")
          # VBV/patch/patch_wasm_runtime.py owns the final worker policy.
          # Keep its opt-in ?workers / ?serverworker gate intact; do not rewrite
          # the shell option here (the write hook validates and patches it later).
          path.write_text(text, encoding="utf-8")
          print("Preserved the VBV low-memory opt-in worker bootstrap")
          PY
          # Remove the packager's original early release injection first.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("wasm-toolchain/build-single-html.js")
          text = path.read_text(encoding="utf-8")
          early = (
              "html = html.replace(\n"
              "  \"window.__eaglerWasmModule = module;\",\n"
              "  \"window.__eaglerWasmModule = module;\\n\\t\\t\\t\\t\\twindow.__eagReleaseInlineWasm();\"\n"
              ");"
          )
          if text.count(early) != 1:
              raise SystemExit(f"Expected exactly one early WASM cleanup injection; found {text.count(early)}")
          text = text.replace(early, "", 1)
          if "__eagReleaseInlineWasm();" in text:
              raise SystemExit("An early WASM release call remains in the packager")
          path.write_text(text, encoding="utf-8")
          print("Removed the premature WASM cleanup call from the packager")
          PY
          # Release inline WASM only after the main module has instantiated.
          # This line is in the actual TeaVM shell source, not the HTML packager.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("target_teavm_wasm_gc/src/web/index.html")
          text = path.read_text(encoding="utf-8")
          marker = "window.__loaded = true;"
          if text.count(marker) != 1:
              raise SystemExit(f"Expected exactly one post-instantiation marker; found {text.count(marker)}")
          if "window.__eagReleaseInlineWasm();" in text:
              raise SystemExit("Inline WASM release is already present in the shell")
          text = text.replace(
              marker,
              "window.__eagReleaseInlineWasm();\n\t\t\t\t" + marker,
              1
          )
          if text.index("window.__eagReleaseInlineWasm();") > text.index(marker):
              raise SystemExit("Inline WASM release was not placed before the loaded marker")
          path.write_text(text, encoding="utf-8")
          print("Moved inline WASM cleanup to the successful post-instantiation path")
          PY
          ! grep -q 'window.__eagReleaseInlineWasm();' wasm-toolchain/build-single-html.js
          grep -q 'window.__eagReleaseInlineWasm();' target_teavm_wasm_gc/src/web/index.html
          grep -q 'window.__loaded = true;' target_teavm_wasm_gc/src/web/index.html
          grep -q 'if (withMusic && !fs.existsSync(musicSource))' wasm-toolchain/build-single-html.js
          grep -q 'withoutMusic && !liteBuild && fs.existsSync(musicSource)' wasm-toolchain/build-single-html.js
          grep -q 'No music.epk present; optional music pack export skipped' wasm-toolchain/build-single-html.js
          # Standalone HTML size is unrestricted; keep the full client even when it exceeds the upstream 90 MB guard.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("wasm-toolchain/build-single-html.js")
          text = path.read_text(encoding="utf-8")
          old_guard = '''if (withoutMusic && outputBytes > target && !diagnosticBuild && !fastPackage) {
            fail(`lean standalone exceeded the size target by ${(outputBytes - target).toLocaleString()} bytes`);
          }'''
          new_guard = '''if (withoutMusic && outputBytes > target && !diagnosticBuild && !fastPackage) {
            console.log("[single-html] Standalone size target exceeded; continuing because output size is unrestricted");
          }'''
          if old_guard in text:
              text = text.replace(old_guard, new_guard, 1)
          elif 'Standalone size target exceeded; continuing because output size is unrestricted' not in text:
              raise SystemExit("Expected standalone size guard was not found; refusing to continue without verifying the packager")
          path.write_text(text, encoding="utf-8")
          print("Disabled the standalone HTML size failure; full-size output is allowed")
          PY
          grep -q 'Standalone size target exceeded; continuing because output size is unrestricted' wasm-toolchain/build-single-html.js
      - name: Build standalone Eaglercraft 26.2 u2 HTML
        working-directory: eaglercraft-u2
        env:
          EAGLER_LINK_CAP_MIB: "13312"
          EAGLER_LINK_HEAP_MIB: "11264"
          EAGLER_SERVER_LINK_CAP_MIB: "13312"
          EAGLER_SERVER_LINK_HEAP_MIB: "11264"
          EAGLER_BUILD_CAP_MIB: "13312"
          EAGLER_BROTLI_QUALITY: "6"
          EAGLER_COMPRESS_JOBS: "3"
        run: |
          set -euo pipefail
          npm run build:single -- --output "$GITHUB_WORKSPACE/eaglercraft-26.2-vbv-herz.html"
          test -s "$GITHUB_WORKSPACE/eaglercraft-26.2-vbv-herz.html"
      - name: Verify standalone HTML and embedded runtime
        shell: bash
        run: |
          set -euo pipefail
          html="$GITHUB_WORKSPACE/eaglercraft-26.2-vbv-herz.html"
          test -s "$html"
          require_marker() {
            if ! grep -Fq "$1" "$html"; then
              echo "::error::Standalone HTML is missing required marker: $1"
              exit 1
            fi
          }
          # Worker compilation is opt-in; the HTML and Java-side gates must agree.
          require_marker 'serverWorker: (window.location.search.indexOf("workers") >= 0 || window.location.search.indexOf("serverworker") >= 0)'
          require_marker 'meshWorkers: (window.location.search.indexOf("workers") >= 0 || window.location.search.indexOf("serverworker") >= 0)'
          require_marker 'VBV low-memory worker bootstrap'
          if grep -Fq 'function globalPath(name)' "$html"; then
            echo "Validated the safe globalPath resolver in the final HTML"
          else
            echo "No TeaVM global resolver was emitted; verified no unsafe dynamic resolver remains"
          fi
          if grep -Fq 'new Function("return " + name + ";")' "$html"; then
            echo "::error::Unsafe TeaVM global resolver remains in final HTML"
            exit 1
          fi
          if grep -Fq 'new Function("value", name + " = value;")' "$html"; then
            echo "::error::Unsafe TeaVM global setter remains in final HTML"
            exit 1
          fi
          for marker in eag-inline-wasm-br eag-inline-mesh-wasm-br eag-inline-server-wasm-br eag-inline-assets eag-inline-sounds VBV_WASM_GC_ASYNC_I64_BRIDGE VBV_WASM_I64_EXPORT_GUARD_V1; do
            require_marker "$marker"
          done
          if grep -Fq 'eag-inline-music' "$html"; then
            echo "::error::Lean build unexpectedly embedded music.epk"
            exit 1
          fi
          echo "Built HTML: $(stat -c%s "$html") bytes"
      - name: Preserve raw standalone HTML if build verification fails
        if: failure() && hashFiles('eaglercraft-26.2-vbv-herz.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Eaglercraft-26.2-VBV-Herz-Raw-Debug-${{ github.run_id }}
          path: eaglercraft-26.2-vbv-herz.html
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 0
      - name: Inject visible runtime console into the main standalone HTML
        shell: bash
        run: |
          set -euo pipefail
          cp eaglercraft-26.2-vbv-herz.html eaglercraft-26.2-vbv-herz-pre-console.html
          node VBV/patch/inject_error_overlay.js eaglercraft-26.2-vbv-herz-pre-console.html eaglercraft-26.2-vbv-herz.html
          test -s eaglercraft-26.2-vbv-herz.html
          grep -q 'id="vbv-diag-script"' eaglercraft-26.2-vbv-herz.html
          grep -q 'window.__vbvDiagReady = true' eaglercraft-26.2-vbv-herz.html
          grep -q 'VBV runtime console (tap to collapse)' eaglercraft-26.2-vbv-herz.html
          grep -q 'refresh();' eaglercraft-26.2-vbv-herz.html
          rm -f eaglercraft-26.2-vbv-herz-pre-console.html
          echo "Visible runtime console embedded: $(stat -c%s eaglercraft-26.2-vbv-herz.html) bytes"
          web_root="eaglercraft-u2/target_teavm_wasm_gc/build/web"
          test -s "$web_root/index.html"
          cp VBV/patch/vbv-coi-sw.js "$web_root/vbv-sw.js"
          node VBV/patch/inject_error_overlay.js "$web_root/index.html" "$web_root/index.html"
          mkdir -p vbv-coi-standalone
          cp eaglercraft-26.2-vbv-herz.html vbv-coi-standalone/index.html
          cp VBV/patch/vbv-coi-sw.js vbv-coi-standalone/vbv-sw.js
          python3 - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          from pathlib import Path
          root = Path("vbv-coi-standalone")
          with ZipFile("eaglercraft-26.2-vbv-herz-coi.zip", "w", ZIP_DEFLATED, compresslevel=6) as archive:
              for path in root.iterdir():
                  archive.write(path, path.name)
          PY
          test -s eaglercraft-26.2-vbv-herz-coi.zip
      - name: Upload standalone HTML client
        uses: actions/upload-artifact@v4
        with:
          name: Eaglercraft-26.2-VBV-Herz-Single-HTML-${{ github.run_id }}
          path: eaglercraft-26.2-vbv-herz.html
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload cross-origin-isolated website bundle
        uses: actions/upload-artifact@v4
        with:
          name: Eaglercraft-26.2-VBV-Herz-COI-Website-${{ github.run_id }}
          path: eaglercraft-26.2-vbv-herz-coi.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload raw browser website too
        uses: actions/upload-artifact@v4
        with:
          name: Eaglercraft-26.2-VBV-Herz-Web-${{ github.run_id }}
          path: eaglercraft-u2/target_teavm_wasm_gc/build/web/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
