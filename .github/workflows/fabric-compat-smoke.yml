name: "Fabric compatibility API smoke test"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "VBV/src/main/java/**"
      - "VBV/patch/**"
      - ".github/workflows/fabric-compat-smoke.yml"

permissions:
  contents: read

jobs:
  compile-compat-shim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Check patch script syntax
        run: python3 -m py_compile VBV/patch/apply_vbv_patch.py VBV/patch/post_vbv_fixes.py

      - name: Compile compatibility APIs against minimal Eagler stubs
        shell: bash
        run: |
          set -euo pipefail
          test -s VBV/src/main/java/net/fabricmc/api/ModInitializer.java
          test -s VBV/src/main/java/net/fabricmc/loader/api/FabricLoader.java
          test -s VBV/src/main/java/net/fabricmc/fabric/api/client/event/lifecycle/v1/ClientTickEvents.java
          test -s VBV/src/main/java/net/fabricmc/fabric/api/client/event/lifecycle/v1/ClientResourceEvents.java
          test -s VBV/src/main/java/net/fabricmc/fabric/api/client/screen/v1/ScreenEvents.java
          test -s VBV/src/main/java/net/fabricmc/fabric/api/client/rendering/v1/HudRenderCallback.java
          grep -q 'HudRenderCallback.EVENT.register' VBV/src/main/java/com/melonman106/vbvclient/VBVClient.java
          grep -q 'ClientTickEvents.END_CLIENT_TICK.register' VBV/src/main/java/com/melonman106/vbvclient/VBVClient.java
          grep -q 'KeyBindingHelper.registerKeyBinding' VBV/src/main/java/com/melonman106/vbvclient/VBVExtraFeatures.java
          test -s VBV/patch/resources/assets/vbvclient/lang/en_us.json
          grep -q 'Migrated' VBV/patch/post_vbv_fixes.py
          test -s VBV/src/main/java/net/fabricmc/fabric/api/client/keybinding/v1/KeyBindingHelper.java

          mkdir -p /tmp/fabric-compat-smoke/stubs/net/minecraft/client/gui/screens
          mkdir -p /tmp/fabric-compat-smoke/stubs/net/minecraft/client/gui
          mkdir -p /tmp/fabric-compat-smoke/stubs/net/minecraft/client
          mkdir -p /tmp/fabric-compat-smoke/stubs/com/melonman106/vbvclient
          mkdir -p /tmp/fabric-compat-smoke/classes

          cat > /tmp/fabric-compat-smoke/stubs/net/minecraft/client/Minecraft.java <<'JAVA'
          package net.minecraft.client;
          public class Minecraft {
              public static Minecraft getInstance() { return new Minecraft(); }
          }
          JAVA

          cat > /tmp/fabric-compat-smoke/stubs/net/minecraft/client/DeltaTracker.java <<'JAVA'
          package net.minecraft.client;
          public class DeltaTracker {}
          JAVA

          cat > /tmp/fabric-compat-smoke/stubs/net/minecraft/client/KeyMapping.java <<'JAVA'
          package net.minecraft.client;
          public class KeyMapping {}
          JAVA

          cat > /tmp/fabric-compat-smoke/stubs/net/minecraft/client/gui/GuiGraphicsExtractor.java <<'JAVA'
          package net.minecraft.client.gui;
          public class GuiGraphicsExtractor {}
          JAVA

          cat > /tmp/fabric-compat-smoke/stubs/net/minecraft/client/gui/screens/Screen.java <<'JAVA'
          package net.minecraft.client.gui.screens;
          public class Screen {}
          JAVA

          cat > /tmp/fabric-compat-smoke/stubs/com/melonman106/vbvclient/VBVModInfo.java <<'JAVA'
          package com.melonman106.vbvclient;
          public record VBVModInfo(String id, String name, String version, String authors,
                                   String description, String iconPath, boolean resourcePackMod) {}
          JAVA

          cat > /tmp/fabric-compat-smoke/stubs/com/melonman106/vbvclient/VBVClient.java <<'JAVA'
          package com.melonman106.vbvclient;
          import java.util.Collection;
          import java.util.List;
          public final class VBVClient {
              public static void init() {}
              public static Collection<VBVModInfo> getMods() { return List.of(); }
          }
          JAVA

          cat > /tmp/fabric-compat-smoke/stubs/com/melonman106/vbvclient/HerzVBVBridge.java <<'JAVA'
          package com.melonman106.vbvclient;
          public final class HerzVBVBridge {
              public static void initialize() {}
              public static void register(VBVModInfo info) {}
          }
          JAVA

          find VBV/src/main/java/com/melonman106/vbvclient/fabriccompat VBV/src/main/java/net/fabricmc \
            -name '*.java' -print > /tmp/fabric-compat-smoke/sources.txt
          find /tmp/fabric-compat-smoke/stubs -name '*.java' -print >> /tmp/fabric-compat-smoke/sources.txt
          javac -Xlint:all -d /tmp/fabric-compat-smoke/classes @/tmp/fabric-compat-smoke/sources.txt
          echo "Fabric compatibility API Java sources compiled successfully."
