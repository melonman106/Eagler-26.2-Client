name: "05 - Repair standalone asset PNGs"
run-name: "05 - Repair Bad PNG Signature + hide startup console"

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repair scripts
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Find latest successful native standalone build
        id: run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "${{ github.repository }}" --workflow "02-compile-eagler-vbv.yml" --status success --limit 20 --json databaseId --jq '.[0].databaseId')"
          [ -n "$run_id" ] || { echo "::error::No successful workflow 02 run found."; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using workflow 02 run: $run_id"

      - name: Download standalone HTML artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="${{ steps.run.outputs.run_id }}"
          artifact_name="Eaglercraft-26.2-VBV-Herz-Single-HTML-$run_id"
          artifact_id="$(gh api "repos/${{ github.repository }}/actions/runs/$run_id/artifacts?per_page=100" --jq ".artifacts[] | select(.name == \"$artifact_name\" and .expired == false) | .id" | head -n1)"
          [ -n "$artifact_id" ] || { echo "::error::No unexpired $artifact_name artifact found."; exit 1; }
          mkdir -p input
          gh api "repos/${{ github.repository }}/actions/artifacts/$artifact_id/zip" > input/artifact.zip
          unzip -q input/artifact.zip -d input/client
          html="$(find input/client -type f -name 'eaglercraft-26.2-vbv-herz.html' -print -quit)"
          [ -n "$html" ] || { echo "::error::Standalone HTML was not found in artifact."; exit 1; }
          cp "$html" ./eaglercraft-26.2-vbv-herz.html
          test -s ./eaglercraft-26.2-vbv-herz.html

      - name: Repair embedded asset PNG signatures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check Pillow
          python3 VBV/patch/fix_embedded_assets.py eaglercraft-26.2-vbv-herz.html eaglercraft-26.2-vbv-herz-fixed.html
          test -s eaglercraft-26.2-vbv-herz-fixed.html
          grep -q 'id="vbv-diag-autohide"' eaglercraft-26.2-vbv-herz-fixed.html
          grep -q 'eag-inline-assets' eaglercraft-26.2-vbv-herz-fixed.html
          echo "Fixed HTML: $(stat -c%s eaglercraft-26.2-vbv-herz-fixed.html) bytes"

      - name: Upload repaired standalone client
        uses: actions/upload-artifact@v4
        with:
          name: Eaglercraft-26.2-VBV-Herz-Fixed-PNG-${{ github.run_id }}
          path: eaglercraft-26.2-vbv-herz-fixed.html
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
