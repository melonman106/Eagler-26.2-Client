name: Convert HTML Artifact to XML

on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: "GitHub Actions artifact page URL"
        required: true
        type: string
      output_name:
        description: "Base name for the output file"
        required: false
        default: converted-output
        type: string

permissions:
  contents: read
  actions: read

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip
          python3 -m pip install --disable-pip-version-check lxml

      - name: Download artifact ZIP from GitHub API
        shell: bash
        env:
          ARTIFACT_URL: ${{ inputs.artifact_url }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from urllib.request import Request, urlopen

          artifact_url = os.environ["ARTIFACT_URL"]
          repo = os.environ["REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          match = re.search(r"/artifacts/(\d+)", artifact_url)
          if not match:
              raise SystemExit("Please provide a GitHub Actions artifact page URL that contains /artifacts/<id>.")

          artifact_id = match.group(1)
          api_url = f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}/zip"

          req = Request(
              api_url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "github-actions"
              }
          )

          with urlopen(req) as response:
              data = response.read()

          with open("artifact.zip", "wb") as f:
              f.write(data)

          print(f"Downloaded artifact.zip ({len(data)} bytes)")
          PY

      - name: Extract artifact ZIP
        shell: bash
        run: |
          set -euo pipefail
          unzip -q artifact.zip -d extracted
          echo "Extracted files:"
          find extracted -type f | sed 's#^#- #'

      - name: Find HTML file
        shell: bash
        run: |
          set -euo pipefail
          HTML_FILE="$(find extracted -type f \( -name '*.html' -o -name '*.htm' \) | head -n 1)"
          if [ -z "$HTML_FILE" ]; then
            echo "::error::No HTML file found inside the artifact ZIP."
            exit 1
          fi
          echo "HTML_FILE=$HTML_FILE" >> "$GITHUB_ENV"
          echo "Found HTML file: $HTML_FILE"
          stat -c "HTML size: %s bytes" "$HTML_FILE"

      - name: Convert HTML to XML
        shell: bash
        env:
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          from lxml import html, etree
          import os

          input_path = Path(os.environ["HTML_FILE"])
          output_name = os.environ["OUTPUT_NAME"]
          output_path = Path(f"{output_name}.xml")

          raw = input_path.read_bytes()

          # Parse HTML and serialize as well-formed XML/XHTML
          doc = html.fromstring(raw)
          xml_bytes = etree.tostring(
              doc.getroottree(),
              pretty_print=True,
              encoding="UTF-8",
              xml_declaration=True,
              method="xml"
          )

          output_path.write_bytes(xml_bytes)
          print(f"Created XML file: {output_path} ({output_path.stat().st_size} bytes)")
          PY

      - name: Upload XML artifact
        uses: actions/upload-artifact@v4
        with:
          name: xml-output-${{ github.run_id }}
          path: ${{ inputs.output_name }}.xml
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
