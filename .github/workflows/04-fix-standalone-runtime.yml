name: "04 - Fix standalone Eagler runtime"
run-name: "04 - Lean low-memory client + visible runtime console"

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout patch scripts
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Find latest successful native standalone build
        id: run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "${{ github.repository }}" --workflow "02-compile-eagler-vbv.yml" --status success --limit 20 --json databaseId --jq '.[0].databaseId')"
          [ -n "$run_id" ] || { echo "::error::No successful workflow 02 run found."; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using workflow 02 run: $run_id"

      - name: Download standalone HTML artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="${{ steps.run.outputs.run_id }}"
          artifact_name="Eaglercraft-26.2-VBV-Herz-Single-HTML-$run_id"
          artifact_id="$(gh api "repos/${{ github.repository }}/actions/runs/$run_id/artifacts?per_page=100" --jq ".artifacts[] | select(.name == \"$artifact_name\" and .expired == false) | .id" | head -n1)"
          [ -n "$artifact_id" ] || { echo "::error::No unexpired $artifact_name artifact found."; exit 1; }
          mkdir -p input
          gh api "repos/${{ github.repository }}/actions/artifacts/$artifact_id/zip" > input/artifact.zip
          unzip -q input/artifact.zip -d input/client
          html="$(find input/client -type f -name 'eaglercraft-26.2-vbv-herz.html' -print -quit)"
          [ -n "$html" ] || { echo "::error::Standalone HTML was not found in artifact."; exit 1; }
          cp "$html" ./eaglercraft-26.2-vbv-herz.html
          test -s ./eaglercraft-26.2-vbv-herz.html

      - name: Make the lean low-memory client and visible console copy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          node VBV/patch/lean_shell.js eaglercraft-26.2-vbv-herz.html dist/eaglercraft-26.2-vbv-herz-lean.html
          node VBV/patch/inject_error_overlay.js dist/eaglercraft-26.2-vbv-herz-lean.html dist/eaglercraft-26.2-vbv-herz-lean-diag.html

          lean=dist/eaglercraft-26.2-vbv-herz-lean.html
          diag=dist/eaglercraft-26.2-vbv-herz-lean-diag.html

          grep -q 'serverWorker: false' "$lean"
          grep -q 'meshWorkers: false' "$lean"
          grep -q 'const enableWorkers = false;' "$lean"
          grep -q 'const meshModulePromise = Promise.resolve(null);' "$lean"
          grep -q 'const serverModulePromise = Promise.resolve(null);' "$lean"
          grep -q 'const workerModules = \[null, null\];' "$lean"
          ! grep -q 'eag-inline-mesh-wasm-br' "$lean"
          ! grep -q 'eag-inline-server-wasm-br' "$lean"
          grep -q 'eag-inline-wasm-br' "$lean"
          grep -q 'eag-inline-assets' "$lean"
          grep -q 'eag-inline-sounds' "$lean"

          # Only executable JavaScript blocks are syntax-checked. The large
          # application/octet-stream script tags are binary payload containers.
          python3 - "$lean" <<'PY'
          import re, subprocess, sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          blocks = re.findall(r'<script([^>]*)>([\s\S]*?)</script>', text, re.I)
          checked = 0
          for i, (attrs, script) in enumerate(blocks):
              typ = re.search(r'\btype=["\']([^"\']+)["\']', attrs, re.I)
              typ = typ.group(1).lower() if typ else "text/javascript"
              if typ not in ("text/javascript", "application/javascript", "module", "text/ecmascript"):
                  continue
              if not script.strip():
                  continue
              p = subprocess.run(["node", "--check"], input=script, text=True, capture_output=True)
              checked += 1
              if p.returncode:
                  print(f"::error::Generated JavaScript block {i} has invalid syntax")
                  print(p.stderr)
                  raise SystemExit(1)
          print(f"Checked {checked} executable JavaScript blocks")
          PY

          grep -q 'id="vbv-diag-script"' "$diag"
          grep -q 'window.__vbvDiagReady = true' "$diag"
          grep -q 'VBV runtime console (tap to collapse)' "$diag"
          grep -q 'Save report' "$diag"
          ! grep -q 'navigator.clipboard.writeText' "$diag"

          echo "Lean HTML: $(stat -c%s "$lean") bytes"
          echo "Console HTML: $(stat -c%s "$diag") bytes"
          ls -lh dist

      - name: Upload lean client and diagnostics copy
        uses: actions/upload-artifact@v4
        with:
          name: Eaglercraft-26.2-VBV-Herz-Lean-${{ github.run_id }}
          path: dist/*.html
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
