name: "03 - Retrieve Eaglercraft 26.2 u2 (Single HTML)"

run-name: "03 - Retrieve latest VBV + Herz single HTML"

on:
  workflow_dispatch:
    inputs:
      compile_run_id:
        description: "Run ID from workflow 02. Leave blank to use the newest successful build."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  retrieve-single-html:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve successful U2 build
        id: compile
        env:
          REQUESTED_RUN_ID: ${{ inputs.compile_run_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$REQUESTED_RUN_ID"
          if [ -z "$run_id" ]; then
            run_id="$(gh api "repos/${{ github.repository }}/actions/workflows/02-compile-eagler-vbv.yml/runs?status=success&per_page=20" --jq '.workflow_runs | map(select(.conclusion == "success")) | .[0].id // empty')"
          fi
          [ -n "$run_id" ] || { echo "::error::No successful workflow 02 run found. Run workflow 02 first."; exit 1; }

          artifact_name="Eaglercraft-26.2-VBV-Herz-Single-HTML-$run_id"
          artifact_id="$(gh api "repos/${{ github.repository }}/actions/runs/$run_id/artifacts?per_page=100" --jq ".artifacts[] | select(.name == \"$artifact_name\" and .expired == false) | .id" | head -n1)"
          [ -n "$artifact_id" ] || { echo "::error::No unexpired $artifact_name artifact found in workflow run $run_id."; exit 1; }

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Download standalone HTML
        env:
          RUN_ID: ${{ steps.compile.outputs.run_id }}
          ARTIFACT_NAME: ${{ steps.compile.outputs.artifact_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name "$ARTIFACT_NAME" --dir output
          test -s output/eaglercraft-26.2-vbv-herz.html

      - name: Upload a fresh copy of the standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: Eaglercraft-26.2-VBV-Herz-Single-HTML-Retrieved-${{ github.run_id }}
          path: output/eaglercraft-26.2-vbv-herz.html
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
