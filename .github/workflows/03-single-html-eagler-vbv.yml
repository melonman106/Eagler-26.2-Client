name: "03 - Retrieve Eaglercraft 26.2 u2 (Single HTML)"

run-name: "03 - Retrieve latest native VBV single HTML"

on:
  workflow_dispatch:
    inputs:
      compile_run_id:
        description: "Run ID from workflow 02. Leave blank to use the newest successful build."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  retrieve-single-html:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve successful native VBV build
        id: compile
        env:
          REQUESTED_RUN_ID: ${{ inputs.compile_run_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$REQUESTED_RUN_ID"
          if [ -z "$run_id" ]; then
            run_id="$(gh api "repos/${{ github.repository }}/actions/workflows/02-compile-eagler-vbv.yml/runs?status=success&per_page=20" --jq '.workflow_runs | map(select(.conclusion == "success")) | .[0].id // empty')"
          fi
          [ -n "$run_id" ] || { echo "::error::No successful workflow 02 run found. Run workflow 02 first."; exit 1; }

          artifact_name="Eaglercraft-26.2-VBV-Herz-Single-HTML-$run_id"
          artifact_id="$(gh api "repos/${{ github.repository }}/actions/runs/$run_id/artifacts?per_page=100" --jq ".artifacts[] | select(.name == \"$artifact_name\" and .expired == false) | .id" | head -n1)"
          [ -n "$artifact_id" ] || { echo "::error::No unexpired $artifact_name artifact found in workflow run $run_id."; exit 1; }

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Download standalone HTML
        env:
          RUN_ID: ${{ steps.compile.outputs.run_id }}
          ARTIFACT_NAME: ${{ steps.compile.outputs.artifact_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p output
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name "$ARTIFACT_NAME" --dir output
          test -s output/eaglercraft-26.2-vbv-herz.html

      - name: Fix standalone Eagler runtime bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("output/eaglercraft-26.2-vbv-herz.html")
          text = path.read_text(encoding="utf-8")

          # Disable both optional worker execution paths. The client then uses
          # the normal main-thread runtime, which is the intended low-memory
          # configuration for this standalone Chromebook build.
          text = re.sub(
              r'(?m)^\s*serverWorker:\s*window\.location\.search\.indexOf\("singlethread"\)\s*<\s*0,',
              'serverWorker: false,',
              text,
          )
          text = re.sub(
              r'(?m)^\s*meshWorkers:\s*window\.location\.search\.indexOf\("singlethread"\)\s*<\s*0\s*\n\s*&&\s*window\.location\.search\.indexOf\("nomesh"\)\s*<\s*0,',
              'meshWorkers: false,',
              text,
          )

          # Remove the actual worker preload elements, regardless of attribute
          # order. The worker names may still occur in the client's JS code;
          # those references are harmless when both worker options are false.
          text, preload_count = re.subn(
              r'(?is)<link\b(?=[^>]*\bhref\s*=\s*["\'][^"\']*(?:mesh-worker|server-worker)\.wasm[^"\']*["\'])[^>]*>\s*',
              '',
              text,
          )

          # The generated payloads are script elements. Match the element by
          # its ID rather than assuming a particular attribute ordering/tag.
          worker_ids = ("eag-inline-mesh-wasm-br", "eag-inline-server-wasm-br")
          payload_count = 0
          for worker_id in worker_ids:
              pattern = rf'(?is)<script\b[^>]*\bid\s*=\s*["\']{re.escape(worker_id)}["\'][^>]*>.*?</script>\s*'
              text, count = re.subn(pattern, '', text, count=1)
              payload_count += count

          if 'serverWorker: false' not in text:
              raise SystemExit('serverWorker=false was not installed')
          if 'meshWorkers: false' not in text:
              raise SystemExit('meshWorkers=false was not installed')

          # Do NOT search for the ID as a plain substring: the client JS can
          # legitimately contain getElementById("eag-inline-mesh-wasm-br") even
          # after the payload element itself has been removed.
          for worker_id in worker_ids:
              element_re = rf'(?is)<script\b[^>]*\bid\s*=\s*["\']{re.escape(worker_id)}["\'][^>]*>'
              if re.search(element_re, text):
                  raise SystemExit(f'{worker_id} payload element was not removed')

          if 'eag-inline-wasm-br' not in text:
              raise SystemExit('main WASM payload is missing')
          if 'eag-inline-assets' not in text:
              raise SystemExit('assets payload is missing')
          if 'eag-inline-sounds' not in text:
              raise SystemExit('sounds payload is missing')

          path.write_text(text, encoding="utf-8")
          print(f"Removed worker preloads: {preload_count}; worker payload elements: {payload_count}")
          print(f"Fixed HTML size: {path.stat().st_size} bytes")
          PY

      - name: Verify fixed downloaded client is native-only
        run: |
          set -euo pipefail
          if grep -q 'VBV-WEBMC-JSMOD-INTEGRATION' output/eaglercraft-26.2-vbv-herz.html; then
            echo "::error::Legacy WebMC/JSMod integration marker found"
            exit 1
          fi
          if grep -q 'webmc-jsmod' output/eaglercraft-26.2-vbv-herz.html; then
            echo "::error::Legacy webmc-jsmod marker found"
            exit 1
          fi
          if grep -q 'VBVJSMods' output/eaglercraft-26.2-vbv-herz.html; then
            echo "::error::Legacy VBVJSMods marker found"
            exit 1
          fi

      - name: Upload a fresh copy of the standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: Eaglercraft-26.2-VBV-Native-Single-HTML-Fixed-${{ github.run_id }}
          path: ${{ github.workspace }}/output/eaglercraft-26.2-vbv-herz.html
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
