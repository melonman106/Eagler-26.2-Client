name: 06 - Deploy VBV Friends (Cloudflare Worker + D1)

# Manual only. Running this workflow is what creates (or updates) the Cloudflare resources:
#   - a D1 database called "vbv-friends" (created only if it does not exist yet)
#   - the schema migrations in cloudflare/vbv-friends/migrations (applied once each, in order)
#   - the Worker "vbv-friends" (its URL is https://vbv-friends.<your-subdomain>.workers.dev)
#
# One-time setup in the repo: Settings > Secrets and variables > Actions > New repository secret
#   CLOUDFLARE_API_TOKEN   an API token with "Workers Scripts: Edit" and "D1: Edit" on your account
#   CLOUDFLARE_ACCOUNT_ID  your account id (Workers & Pages overview, right-hand side)
#
# Voice chat (optional; without these the Friends screen still works and the voice buttons report "not set up"):
#   CF_REALTIME_APP_ID     } from Cloudflare dashboard > Realtime > SFU > Create application
#   CF_REALTIME_APP_SECRET }
#   TURN_KEY_ID            } optional: Realtime > TURN > Create key. Strongly recommended for school or other
#   TURN_KEY_API_TOKEN     } restricted networks, where voice usually cannot connect directly.
# The workflow stores them as Worker secrets (they are never written to the repository or the logs).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vbv-friends
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/vbv-friends
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_REALTIME_APP_ID: ${{ secrets.CF_REALTIME_APP_ID }}
      CF_REALTIME_APP_SECRET: ${{ secrets.CF_REALTIME_APP_SECRET }}
      TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
      TURN_KEY_API_TOKEN: ${{ secrets.TURN_KEY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the Worker against the real schema
        run: npm test

      - name: Check the Cloudflare secrets are set
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (Settings > Secrets and variables > Actions)."
              missing=1
            fi
          done
          exit $missing

      - name: Find or create the D1 database
        run: |
          set -euo pipefail
          find_id() {
            npx --yes wrangler@4 d1 list --json | node -e '
              let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
                const list = JSON.parse(s);
                const db = list.find(d => d.name === "vbv-friends");
                process.stdout.write(db ? (db.uuid || db.id || "") : "");
              });'
          }
          DB_ID="$(find_id)"
          if [ -z "$DB_ID" ]; then
            echo "Creating D1 database vbv-friends"
            npx --yes wrangler@4 d1 create vbv-friends
            DB_ID="$(find_id)"
          fi
          if [ -z "$DB_ID" ]; then
            echo "::error::Could not find or create the D1 database vbv-friends."
            exit 1
          fi
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$DB_ID/" wrangler.toml
          grep -q "$DB_ID" wrangler.toml
          echo "D1 database id: $DB_ID"

      - name: Apply migrations
        run: npx --yes wrangler@4 d1 migrations apply vbv-friends --remote

      - name: Deploy the Worker
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' deploy.log | head -n 1 || true)"
          echo "WORKER_URL=$URL" >> "$GITHUB_ENV"

      - name: Store the voice chat secrets (only the ones that are set)
        run: |
          set -euo pipefail
          # A pair is only useful whole: warn about a half-set pair and skip it.
          put_pair() {
            local a="$1" b="$2" what="$3"
            if [ -n "${!a}" ] && [ -n "${!b}" ]; then
              printf '%s' "${!a}" | npx --yes wrangler@4 secret put "$a" > /dev/null
              printf '%s' "${!b}" | npx --yes wrangler@4 secret put "$b" > /dev/null
              echo "$what: stored $a and $b"
            elif [ -n "${!a}" ] || [ -n "${!b}" ]; then
              echo "::warning::$what: set both $a and $b (only one of them is set), so neither was stored."
            else
              echo "$what: not configured (skipped)"
            fi
          }
          put_pair CF_REALTIME_APP_ID CF_REALTIME_APP_SECRET "Voice chat (Realtime SFU)"
          put_pair TURN_KEY_ID TURN_KEY_API_TOKEN "TURN relay"

      - name: Smoke test
        run: |
          set -euo pipefail
          if [ -z "$WORKER_URL" ]; then
            echo "Deployed, but the workers.dev URL was not found in the log; open the Worker in the Cloudflare dashboard."
            exit 0
          fi
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$WORKER_URL/health"; then echo; break; fi
            echo "Waiting for the Worker to come up..."; sleep 5
          done
          HEALTH="$(curl -fsS "$WORKER_URL/health")"
          [[ "$HEALTH" == *'"ok":true'* ]]
          VOICE="not set up (add CF_REALTIME_APP_ID and CF_REALTIME_APP_SECRET, then run this workflow again)"
          [[ "$HEALTH" == *'"voice":true'* ]] && VOICE="ready"
          TURN="not set up (voice may not connect on school or other restricted networks)"
          [[ "$HEALTH" == *'"turn":true'* ]] && TURN="ready"
          {
            echo "### VBV Friends is live"
            echo
            echo "API address: \`$WORKER_URL\`"
            echo
            echo "- Voice chat: $VOICE"
            echo "- TURN relay: $TURN"
            echo
            echo "The client uses \`https://vbv-friends.<your-subdomain>.workers.dev\` by default; if yours differs, paste the address above into Friends > Settings in the game."
          } >> "$GITHUB_STEP_SUMMARY"
