name: "04 - Import and build Litematica + MaLiLib"

run-name: "Import upstream Litematica + MaLiLib sources"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: litematica-malilib-import
  cancel-in-progress: false

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout this client repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          # Do not enable setup-java's Gradle cache here. The checked-out
          # repository root has no Gradle build files; the upstream projects
          # are cloned/copied into mods/ later in this workflow.

      - name: Fetch upstream source repositories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/upstream

          git clone --depth 1 --branch pre-rewrite/fabric/1.21.1-masa \
            https://github.com/maruohon/litematica.git /tmp/upstream/litematica
          git clone --depth 1 --branch pre-rewrite/fabric/1.21.1-masa \
            https://github.com/maruohon/malilib.git /tmp/upstream/malilib

          mkdir -p mods/Litematica mods/MaLiLib
          rsync -a --delete --exclude='.git/' /tmp/upstream/litematica/ mods/Litematica/
          rsync -a --delete --exclude='.git/' /tmp/upstream/malilib/ mods/MaLiLib/

          echo "Litematica upstream commit: $(git -C /tmp/upstream/litematica rev-parse HEAD)"
          echo "MaLiLib upstream commit: $(git -C /tmp/upstream/malilib rev-parse HEAD)"
          test -s mods/Litematica/LICENSE.txt
          test -s mods/MaLiLib/LICENSE.txt
          test -s mods/Litematica/build.gradle
          test -s mods/MaLiLib/build.gradle

      - name: Commit imported upstream source snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/Litematica mods/MaLiLib

          if git diff --cached --quiet; then
            echo "Upstream source snapshots are already up to date."
          else
            git commit -m "Import upstream Litematica and MaLiLib source"
            git push origin HEAD:main
          fi

      - name: Build upstream MaLiLib reference mod
        working-directory: mods/MaLiLib
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon --stacktrace
          test -n "$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"

      - name: Build upstream Litematica reference mod
        working-directory: mods/Litematica
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon --stacktrace
          test -n "$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"

      - name: Upload upstream reference JARs
        uses: actions/upload-artifact@v4
        with:
          name: Litematica-MaLiLib-Upstream-Reference-JARs-${{ github.run_id }}
          path: |
            mods/MaLiLib/build/libs/*.jar
            mods/Litematica/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
