name: "04 - Prepare Litematica for Eaglercraft"

run-name: "Audit and prepare Litematica + MaLiLib Eagler port"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: litematica-malilib-import
  cancel-in-progress: false

env:
  U2_REPO: "https://github.com/CynTheSolveroftheabsolutefabric/Eaglercraft-26.2-u2-workspace.git"
  U2_COMMIT: "f0dafd1e3c1fb39006735ffc0bc6fd879fa98de3"

jobs:
  prepare-port:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout this client repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch upstream Litematica and MaLiLib sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/upstream
          git clone --depth 1 --branch pre-rewrite/fabric/1.21.1-masa https://github.com/maruohon/litematica.git /tmp/upstream/litematica
          git clone --depth 1 --branch pre-rewrite/fabric/1.21.1-masa https://github.com/maruohon/malilib.git /tmp/upstream/malilib
          mkdir -p mods/Litematica mods/MaLiLib
          rsync -a --delete --exclude='.git/' /tmp/upstream/litematica/ mods/Litematica/
          rsync -a --delete --exclude='.git/' /tmp/upstream/malilib/ mods/MaLiLib/
          test -s mods/Litematica/LICENSE.txt
          test -s mods/MaLiLib/LICENSE.txt
          test -s mods/Litematica/build.gradle
          test -s mods/MaLiLib/build.gradle
          echo "Litematica upstream commit: $(git -C /tmp/upstream/litematica rev-parse HEAD)"
          echo "MaLiLib upstream commit: $(git -C /tmp/upstream/malilib rev-parse HEAD)"

      - name: Fetch the exact Eaglercraft 26.2 u2 workspace
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-tags --filter=blob:none "$U2_REPO" eaglercraft-u2
          cd eaglercraft-u2
          git fetch --no-tags --depth 1 origin "$U2_COMMIT"
          git checkout --detach "$U2_COMMIT"
          test -x gradlew
          test -d game/src/main/java
          echo "Eagler workspace commit: $(git rev-parse HEAD)"

      - name: Audit upstream code for APIs that need porting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path("mods/MaLiLib/src/main"), Path("mods/Litematica/src/main")]
          patterns = [
              ("Fabric API / Loader references", r"\bnet\.fabricmc\b|FabricLoader|ModInitializer|ClientModInitializer"),
              ("Mixin references", r"\borg\.spongepowered\.asm\.mixin\b|@Mixin|@Inject|@Redirect|@ModifyArg|@ModifyVariable"),
              ("Minecraft client/game API references", r"\bnet\.minecraft\b"),
              ("Litematica/MaLiLib internal imports", r"\bfi\.dy\.masa\.(litematica|malilib)\b"),
          ]
          report = [
              "# Litematica / MaLiLib Eaglercraft port audit",
              "",
              "Generated by workflow 04 against the pinned Eaglercraft 26.2 u2 workspace.",
              "",
              "## Compatibility status",
              "",
              "The upstream projects target Fabric/Minecraft 1.21.1. Their JARs are not Eaglercraft browser mods and are not injected into the HTML client by this workflow. A working port must adapt Fabric entry points, mixins, rendering hooks, input hooks, and Minecraft-version-specific APIs.",
              "",
          ]
          for title, pattern in patterns:
              matches = []
              rx = re.compile(pattern)
              for root in roots:
                  if not root.exists():
                      continue
                  for path in root.rglob("*.java"):
                      try:
                          lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
                      except OSError:
                          continue
                      for number, line in enumerate(lines, 1):
                          if rx.search(line):
                              matches.append(f"- {path}:{number}: {line.strip()[:180]}")
              report += [f"## {title} ({len(matches)} matches)", ""]
              report += matches[:250] if matches else ["- No matches found."]
              if len(matches) > 250:
                  report.append(f"- Output truncated: {len(matches) - 250} additional matches.")
              report.append("")
          report += [
              "## Porting direction",
              "",
              "Implement a browser-compatible schematic pipeline in Eagler's own client: parse .litematic/NBT data, provide a schematic UI, and render placement previews through Eagler's renderer. Fabric-only classes cannot simply be copied into the browser build.",
              "",
          ]
          Path("EAGLER_LITEMATICA_PORT_AUDIT.md").write_text("\n".join(report), encoding="utf-8")
          print("Wrote EAGLER_LITEMATICA_PORT_AUDIT.md")
          PY
          test -s EAGLER_LITEMATICA_PORT_AUDIT.md

      - name: Commit imported source snapshots and port audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/Litematica mods/MaLiLib EAGLER_LITEMATICA_PORT_AUDIT.md
          if git diff --cached --quiet; then
            echo "Source snapshots and audit are already up to date."
          else
            git commit -m "Prepare Litematica sources for Eagler port"
            git push origin HEAD:main
          fi

      - name: Build upstream reference JARs (reference only, not browser injection)
        shell: bash
        run: |
          set -euo pipefail
          for project in MaLiLib Litematica; do
            (
              cd "mods/$project"
              chmod +x ./gradlew
              ./gradlew clean build --no-daemon --stacktrace
              test -n "$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
            )
          done

      - name: Upload port audit and upstream reference JARs
        uses: actions/upload-artifact@v4
        with:
          name: Litematica-Eagler-Port-Audit-and-Reference-${{ github.run_id }}
          path: |
            EAGLER_LITEMATICA_PORT_AUDIT.md
            mods/MaLiLib/build/libs/*.jar
            mods/Litematica/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
