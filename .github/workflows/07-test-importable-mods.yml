name: "07 - Plain checks (importable mods, Punchy, JavaScript)"

run-name: "07 - Mods, Punchy and JavaScript checks"

# Runs the checks for the parts of the importable-mods system that use no game classes: the manifest/Fabric-faking
# rules, the zip reader, the store and the example mods; and the game-free core of the Punchy resource-pack
# animations (clip sampling, compat rules, rig maths, controller); and a Node syntax check of every @JSBody script in
# the Java sources (a wrong escape in a Java string breaks the JavaScript, and the compiler cannot see it). It does not
# build or start the game.
on:
  pull_request:
    paths:
      - "VBV/src/main/java/**"
      - "VBV/test/**"
      - "VBV/examples/**"
      - "VBV/patch/check_jsbody_syntax.py"
      - ".github/workflows/07-test-importable-mods.yml"
  push:
    branches: [main]
    paths:
      - "VBV/src/main/java/**"
      - "VBV/test/**"
      - "VBV/examples/**"
      - "VBV/patch/check_jsbody_syntax.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The pinned hash is that of the gson-2.13.1.jar bundled with Maven 3.9.11, which should be the same file as
      # Maven Central's. If this step ever reports a mismatch, compare it with Central's published .sha256 and update.
      - name: Fetch Gson (pinned)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gson.jar" https://repo1.maven.org/maven2/com/google/code/gson/gson/2.13.1/gson-2.13.1.jar
          echo "94855942d4992f112946d3de1c334e709237b8126d8130bf07807c018a4a2120  $RUNNER_TEMP/gson.jar" | sha256sum -c -
          echo "GSON_JAR=$RUNNER_TEMP/gson.jar" >> "$GITHUB_ENV"

      - name: Run the importable-mods checks
        shell: bash
        run: bash VBV/test/run-mods-core-tests.sh

      - name: Run the Punchy checks
        shell: bash
        run: bash VBV/test/run-punchy-core-tests.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax-check the JavaScript inside @JSBody scripts
        shell: bash
        run: python3 VBV/patch/check_jsbody_syntax.py VBV/src/main/java
