name: "01 - Prepare Eaglercraft 26.2 u2 Source Project"

on:
  workflow_dispatch:
    inputs:
      client_jar_url:
        description: "Optional override URL for the Minecraft client JAR"
        required: false
        type: string
      client_jar_sha256:
        description: "Optional SHA-256 override for a non-Mojang client JAR URL"
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare-source-project:
    name: "Prepare verified 26.2 u2 source + Gradle project"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout client repository
        uses: actions/checkout@v4

      - name: Extract the U2 Patcher source
        shell: bash
        run: |
          set -euo pipefail
          archive="eaglercraft-26.2-patcher-main.tar.gz"
          test -s "$archive" || { echo "::error::Missing $archive"; exit 1; }
          rm -rf U2-Patcher
          mkdir -p U2-Patcher
          tar -xzf "$archive" -C U2-Patcher --strip-components=1
          test -n "$(find U2-Patcher -type f -print -quit)"
          echo "U2 Patcher extracted to U2-Patcher/"
          find U2-Patcher -maxdepth 3 -type f | sort | head -200

      - name: Locate and verify the U2 Setup JAR
        id: inputs
        shell: bash
        env:
          CLIENT_JAR_URL: ${{ inputs.client_jar_url || 'https://piston-data.mojang.com/v1/objects/2dc72797acbc1b63fc16a11c4ac393605f453754/client.jar' }}
          CLIENT_JAR_SHA256: ${{ inputs.client_jar_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p build-inputs/portable build-inputs/downloads

          setup_jar=""
          for candidate in \
            U1-Patcher/Eaglercraft-26.2-u2-Setup.jar \
            U1-Patcher/Eaglercraft-26.2-Setup.jar \
            U1-Patcher/*u2*Setup.jar; do
            if [ -f "$candidate" ]; then
              setup_jar="$candidate"
              break
            fi
          done

          if [ -z "$setup_jar" ]; then
            setup_jar="build-inputs/downloads/Eaglercraft-26.2-u2-Setup.jar"
            setup_url="https://github.com/melonman106/Eagler-26.2-Client/releases/download/Cleit/Eaglercraft-26.2-u2-Setup.jar"
            expected_setup_sha256="476fd0aca5638ecfb57ff2383256e2275ab7ac879973cf69191b8a535d2e3ec2"
            curl --fail --location --retry 3 "$setup_url" -o "$setup_jar"
            echo "$expected_setup_sha256  $setup_jar" | sha256sum --check
          else
            setup_jar="$(realpath "$setup_jar")"
            echo "Using U2 Setup JAR from U1-Patcher/: $setup_jar"
          fi

          embedded_kit="build-inputs/downloads/portable-kit.zip"
          embedded_sum="build-inputs/downloads/portable-kit.sha256"
          unzip -p "$setup_jar" portable-kit.zip > "$embedded_kit"
          unzip -p "$setup_jar" portable-kit.sha256 > "$embedded_sum"
          test -s "$embedded_kit"
          test -s "$embedded_sum"
          expected_kit="$(tr -d '[:space:]' < "$embedded_sum")"
          [[ "$expected_kit" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "::error::Invalid portable-kit checksum"; exit 1; }
          echo "$expected_kit  $embedded_kit" | sha256sum --check
          unzip -q -o "$embedded_kit" -d build-inputs/portable

          find_file() {
            local pattern="$1"
            find build-inputs/portable U2-Patcher U1-Patcher -type f -iname "$pattern" -print -quit 2>/dev/null || true
          }

          jar="$(find . -type f \( -iname 'minecraft-26.2-client.jar' -o -iname 'eaglercraft-26.2-client.jar' \) -not -path './.git/*' -print -quit)"
          if [ -z "$jar" ]; then
            [[ "$CLIENT_JAR_URL" == https://* ]] || { echo "::error::Client JAR URL must use HTTPS"; exit 1; }
            curl --fail --location --retry 3 "$CLIENT_JAR_URL" -o build-inputs/downloads/minecraft-26.2-client.jar
            if [ -n "$CLIENT_JAR_SHA256" ]; then
              [[ "$CLIENT_JAR_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "::error::Client JAR SHA-256 must be 64 hexadecimal characters"; exit 1; }
              echo "$CLIENT_JAR_SHA256  build-inputs/downloads/minecraft-26.2-client.jar" | sha256sum --check
            else
              expected_sha1="$(echo "$CLIENT_JAR_URL" | sed -nE 's#https://piston-data\.mojang\.com/v1/objects/([a-fA-F0-9]{40})/client\.jar#\1#p')"
              [ -n "$expected_sha1" ] || { echo "::error::For a non-Mojang URL, provide client_jar_sha256."; exit 1; }
              echo "$expected_sha1  build-inputs/downloads/minecraft-26.2-client.jar" | sha1sum --check
            fi
            jar="$PWD/build-inputs/downloads/minecraft-26.2-client.jar"
          else
            jar="$(realpath "$jar")"
          fi

          vineflower="$(find_file 'vineflower-1.12.0.jar')"
          bundle="$(find_file 'source-patch-bundle.zip')"
          skeleton="$(find_file '*skeleton*.zip')"
          overlay="$(find_file 'resource-overlay-normal.zip')"
          external_root="$(find build-inputs/portable U2-Patcher U1-Patcher -type d -path '*/inputs/resources' -print -quit 2>/dev/null || true)"
          cli_jar="$(find_file 'eaglercraft-26.2-java-cli.jar')"

          for pair in "Vineflower:$vineflower" "source patch bundle:$bundle" "project skeleton:$skeleton" "resource overlay:$overlay" "external resources:$external_root" "authenticated CLI JAR:$cli_jar"; do
            label="${pair%%:*}"; value="${pair#*:}"
            if [ -z "$value" ]; then
              echo "::error::Could not locate $label in the U2 Patcher or authenticated Setup kit."
              exit 1
            fi
          done

          echo "client_jar=$jar" >> "$GITHUB_OUTPUT"
          echo "vineflower=$(realpath "$vineflower")" >> "$GITHUB_OUTPUT"
          echo "bundle=$(realpath "$bundle")" >> "$GITHUB_OUTPUT"
          echo "skeleton=$(realpath "$skeleton")" >> "$GITHUB_OUTPUT"
          echo "overlay=$(realpath "$overlay")" >> "$GITHUB_OUTPUT"
          echo "external_root=$(realpath "$external_root")" >> "$GITHUB_OUTPUT"
          echo "cli_jar=$(realpath "$cli_jar")" >> "$GITHUB_OUTPUT"
          echo "bundle_sha256=$(sha256sum "$bundle" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "skeleton_sha256=$(sha256sum "$skeleton" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "overlay_sha256=$(sha256sum "$overlay" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

          echo "=== U2 Patcher inputs ==="
          sha256sum "$vineflower" "$bundle" "$skeleton" "$overlay" "$cli_jar"

      - name: Set up Java 17 for source reconstruction
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify the authenticated patcher CLI
        env:
          CLI_JAR: ${{ steps.inputs.outputs.cli_jar }}
        run: |
          set -euo pipefail
          test -s "$CLI_JAR"
          jar tf "$CLI_JAR" | grep -q 'com/eaglercraft/patcher/Main.class'

      - name: Reconstruct source and seed the Gradle project
        env:
          CLIENT_JAR: ${{ steps.inputs.outputs.client_jar }}
          VINEFLOWER: ${{ steps.inputs.outputs.vineflower }}
          PATCH_BUNDLE: ${{ steps.inputs.outputs.bundle }}
          SKELETON: ${{ steps.inputs.outputs.skeleton }}
          RESOURCE_OVERLAY: ${{ steps.inputs.outputs.overlay }}
          EXTERNAL_ROOT: ${{ steps.inputs.outputs.external_root }}
          CLI_JAR: ${{ steps.inputs.outputs.cli_jar }}
          BUNDLE_SHA256: ${{ steps.inputs.outputs.bundle_sha256 }}
          SKELETON_SHA256: ${{ steps.inputs.outputs.skeleton_sha256 }}
          OVERLAY_SHA256: ${{ steps.inputs.outputs.overlay_sha256 }}
        run: |
          set -euo pipefail
          java -jar "$CLI_JAR" create-dev \
            --jar "$CLIENT_JAR" \
            --output "$PWD/prepared-eaglercraft-26.2-u2" \
            --vineflower "$VINEFLOWER" \
            --java17 "$(command -v java)" \
            --patch-bundle "$PATCH_BUNDLE" \
            --expected-bundle-sha256 "$BUNDLE_SHA256" \
            --project-skeleton "$SKELETON" \
            --expected-skeleton-sha256 "$SKELETON_SHA256" \
            --resource-overlay "$RESOURCE_OVERLAY" \
            --expected-resource-overlay-sha256 "$OVERLAY_SHA256" \
            --external-resource-root "$EXTERNAL_ROOT"

          test -x prepared-eaglercraft-26.2-u2/gradlew
          test -d prepared-eaglercraft-26.2-u2/game/src/main/java
          test -d prepared-eaglercraft-26.2-u2/target_teavm_wasm_gc

      - name: Publish extracted source project to repository branch
        shell: bash
        run: |
          set -euo pipefail
          test -x prepared-eaglercraft-26.2-u2/gradlew
          test -d prepared-eaglercraft-26.2-u2/game/src/main/java
          test -d prepared-eaglercraft-26.2-u2/target_teavm_wasm_gc

          # Keep generated build sources in their own branch so the main branch
          # does not get overwritten by the large reconstructed source tree.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B generated-u2-source
          git add -f prepared-eaglercraft-26.2-u2
          if git diff --cached --quiet; then
            echo "Generated source tree is unchanged; no repository commit needed."
          else
            git commit -m "Publish generated Eaglercraft 26.2 U2 source project"
          fi
          git push origin generated-u2-source --force
          echo "Published source project at branch generated-u2-source/prepared-eaglercraft-26.2-u2"
